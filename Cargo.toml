[package]
name = "idp-unified"
description = "Local First OIDC / OAuth 2.x implementation"
repository = "https://github.com/aicacia/rs-oauth"
rust-version = "1.98"
edition = "2024"

[package.version]
workspace = true

[package.authors]
workspace = true

[package.license]
workspace = true

[[bin]]
name = "idp-unified"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "completions", "swagger-ui"]
cli = ["unified-server/cli"]
completions = ["unified-server/completions"]
swagger-ui = ["unified-server/swagger-ui"]

[dependencies]
# Internal
unified-server = { path = "./crates/unified-server", default-features = false, optional = true }

# Async
tokio = { version = "1.52", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[workspace]
members = [
  "crates/db",
  "crates/cli",
  "crates/api",
  "crates/bootstrap-service",
  "crates/key",
  "crates/model",
  "crates/management-server",
  "crates/management-service",
  "crates/idp-model",
  "crates/idp-server",
  "crates/idp-service",
  "crates/storage-model",
  "crates/storage-server",
  "crates/storage-service",
  "crates/unified-server",
  "crates/tauri-plugin-fetch-api",
  "apps/app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nathanfaucett@gmail.com"]
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/aicacia/rs-oauth"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
absolute_paths = "warn"
redundant_clone = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
