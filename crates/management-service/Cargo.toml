[package]
name = "management-service"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Management service implementation"

[lib]
name = "management_service"

[features]
default = []

replica = ["std", "dep:db", "idp-model/replica"]

std = [
  "idp-model/std",
  "idp-service/std",
  "model/std",
  "storage-model/std",
  "dep:base64",

  "dep:iroh",
  "dep:reqwest",
  "serde/std",
]

[dependencies]
# Internal
db = { package = "idp-db", path = "../db", default-features = false, features = [], optional = true }
idp-model = { path = "../idp-model", default-features = false, features = [] }
idp-service = { path = "../idp-service", default-features = false, features = [] }

model = { path = "../model", default-features = false, features = [] }
storage-model = { path = "../storage-model", default-features = false, features = [] }
uuid = { version = "1.23", default-features = false, features = ["v5"] }

# Error Handling
thiserror = { version = "2.0", default-features = false, features = [] }


# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Serialization
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Cryptography
base64 = { version = "0.22", default-features = false, features = [], optional = true }
iroh = { version = "1.1", default-features = false, features = [], optional = true }


# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Random


[dev-dependencies]
idp-model = { path = "../idp-model", default-features = false, features = ["std"] }
ofdb-sql = { path = "../../../ofdb/crates/sql", default-features = false, features = ["sync"] }
tokio = { version = "1.4", default-features = false, features = ["macros", "rt"] }
