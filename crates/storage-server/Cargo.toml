[package]
name = "storage-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local first storage server"

[lib]
name = "storage_server"

[[bin]]
name = "storage-server"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "completions", "swagger-ui"]
cli = ["network", "dep:dotenvy", "dep:clap", "dep:cli"]
network = ["dep:tokio", "dep:tokio-util"]
completions = ["cli?/completions"]
swagger-ui = ["utoipa-swagger-ui"]

[dependencies]
# CLI
dotenvy = { version = "0.15", default-features = false, features = [
], optional = true }
clap = { version = "4.6", default-features = false, features = [
  "std",
  "derive",
  "help",
], optional = true }
cli = { path = "../cli", default-features = false, features = [
], optional = true }

# Internal
api = { path = "../api", default-features = false, features = [] }
file-system = { path = "../../../offs/crates/file-system", default-features = false, features = ["iroh"] }
idp-model = { path = "../idp-model", default-features = false, features = ["std"] }
key = { path = "../key", default-features = false, features = ["std"] }
ofdb-kv-sync = { package = "ofdb-kv-sync", path = "../../../ofdb/crates/kv-sync", default-features = false, features = [] }
model = { path = "../model", default-features = false, features = ["std", "utoipa", "axum"] }
ofdb-sql = { package = "ofdb-sql", path = "../../../ofdb/crates/sql", default-features = false, features = ["redb", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
storage-model = { path = "../storage-model", default-features = false, features = ["std"] }
storage-service = { path = "../storage-service", default-features = false, features = [] }


# Serialization
base64 = { version = "0.22", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_qs = { version = "1.1", default-features = false, features = ["axum"] }

# Utilities
config = { version = "0.15", features = ["yaml"], default-features = false }

# Web
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "http2",
  "form",
  "query",
  "json",
  "ws",
  "tokio",
  "macros"
] }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "compression-gzip",
], default-features = false }
http = { version = "1.4", default-features = false }
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
utoipa-axum = { version = "0.2", default-features = false, features = [] }
utoipa-swagger-ui = { version = "9.0", default-features = false, features = ["axum"], optional = true }

# Iroh
iroh-chain = { path = "../../../ofnet/crates/iroh-chain", default-features = false, features = [] }

# Async
tokio = { version = "1.52", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
], optional = true }
tokio-util = { version = "0.7", default-features = false, features = [
], optional = true }

# Logging
log = { version = "0.4", default-features = false, features = ["std"] }
env_logger = { version = "0.10", default-features = false, features = [] }

[dev-dependencies]
# Serialization
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Web
tower = { version = "0.5", default-features = false, features = ["util"] }
