[package]
name = "lidp"
version = "0.1.0"
description = "Local First Identity Provider Tauri App"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lidp"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# HTTP
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
] }
# Random
getrandom = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# TLS
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = [] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Async
log = "0.4"
tokio = { version = "1.52", default-features = false, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }

# Service contracts
idp-model = { path = "../../../crates/idp-model", default-features = false, features = [
  "replica",
  "std",
] }
idp-server = { path = "../../../crates/idp-server", default-features = false, features = [] }
idp-service = { path = "../../../crates/idp-service", default-features = false, features = ["std"] }
management-server = { path = "../../../crates/management-server", default-features = false, features = [] }
model = { path = "../../../crates/model", default-features = false, features = ["std"] }
storage-server = { path = "../../../crates/storage-server", default-features = false, features = ["network"] }
unified-server = { path = "../../../crates/unified-server", default-features = false, features = [] }

# Desktop
tauri = { version = "2", default-features = false, features = [
  "tray-icon",
  "wry",
] }
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = { version = "2", default-features = false, features = [] }
tauri-plugin-single-instance = { version = "2", default-features = false, features = [
  "deep-link",
] }

[dev-dependencies]
# Keyring
keyring-core = { version = "1.0", default-features = false, features = [] }

# Utilities
uuid = { version = "1.16", default-features = false, features = ["std", "v4"] }
